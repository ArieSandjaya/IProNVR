<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plaza Indonesia VMS</title>
<style>
:root{--side:#343a40;--side2:#3f474e;--acc:#007bff;--bg:#f4f6f9;--line:#dee2e6;--fg:#212529;--mut:#6c757d;--ok:#28a745;--warn:#ffc107;--bad:#dc3545;--info:#17a2b8}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Source Sans Pro",system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
button,input,select,textarea{font:inherit}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
.lbox{background:#fff;border-top:3px solid var(--acc);border-radius:4px;box-shadow:0 0 1px rgba(0,0,0,.13),0 1px 3px rgba(0,0,0,.2);padding:24px}
.lbox h1{margin:0 0 4px;font-size:24px;text-align:center;font-weight:300}.lbox h1 b{font-weight:700}
.lbox p{text-align:center;color:var(--mut);margin:0 0 18px}
.lbox input{width:100%;padding:8px 10px;margin:0 0 12px;border:1px solid #ced4da;border-radius:4px}
#wrap{display:flex;min-height:100vh}
#side{width:250px;background:var(--side);color:#c2c7d0;flex:none;transition:margin .2s;display:flex;flex-direction:column}
#side .brand{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #4b545c;color:#fff;font-size:18px;font-weight:300}
#side .brand b{font-weight:700}
.logo{width:32px;height:32px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
#side .user{padding:14px 16px;border-bottom:1px solid #4b545c;display:flex;gap:10px;align-items:center}
#side .user i{width:34px;height:34px;border-radius:50%;background:#6c757d;display:grid;place-items:center;font-style:normal;color:#fff;font-weight:700}
#side .user small{display:block;color:#9aa0a6}
#side .hd{padding:12px 16px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#868e96}
#side a{display:flex;align-items:center;gap:12px;padding:9px 16px;margin:2px 8px;border-radius:4px;color:#c2c7d0;text-decoration:none;cursor:pointer}
#side a:hover{background:var(--side2);color:#fff}
#side a.on{background:var(--acc);color:#fff}
#side a span.ic{width:20px;text-align:center}
#side a em{margin-left:auto;font-style:normal;background:#ffffff26;border-radius:10px;padding:0 8px;font-size:12px}
#side .ft{margin-top:auto;padding:12px 16px;font-size:12px;color:#868e96;border-top:1px solid #4b545c}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{background:#fff;border-bottom:1px solid var(--line);padding:0 16px;height:52px;display:flex;align-items:center;gap:14px}
#top .burger{border:0;background:none;font-size:20px;cursor:pointer;color:#555}
#top .sp{flex:1}
#top .v{color:var(--mut);font-size:13px}
#content{padding:0 16px 24px;flex:1}
.ch{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px;flex-wrap:wrap;gap:8px}
.ch h1{margin:0;font-size:24px;font-weight:400}
.bc{color:var(--mut);font-size:13px}.bc b{color:var(--fg);font-weight:400}
.card{background:#fff;border-radius:4px;border-top:3px solid var(--acc);box-shadow:0 0 1px rgba(0,0,0,.13),0 1px 3px rgba(0,0,0,.2);margin-bottom:16px}
.card .ct{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card .ct h3{margin:0;font-size:17px;font-weight:400;flex:1}
.card .cb{padding:14px;overflow:auto}
.card.nt{border-top-color:var(--line)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:4px;padding:5px 12px;cursor:pointer;background:#fff;border-color:#ced4da;color:var(--fg)}
.btn:hover{filter:brightness(.95)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.s{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.w{background:var(--warn);border-color:var(--warn);color:#212529}.btn.d{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.i{background:var(--info);border-color:var(--info);color:#fff}.btn.sm{padding:2px 8px;font-size:13px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{border-top:0;border-bottom:2px solid var(--line);white-space:nowrap}
tbody tr:hover{background:#00000008}
td.act{white-space:nowrap;text-align:right}
td .mono{font:12px ui-monospace,Consolas,monospace;color:var(--mut);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;color:#fff;background:var(--mut)}
.badge.ok{background:var(--ok)}.badge.bad{background:var(--bad)}.badge.info{background:var(--info)}.badge.warn{background:var(--warn);color:#212529}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{padding:5px 8px;border:1px solid #ced4da;border-radius:4px;background:#fff}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px}
.sb{border-radius:4px;color:#fff;position:relative;overflow:hidden;box-shadow:0 0 1px rgba(0,0,0,.13),0 1px 3px rgba(0,0,0,.2)}
.sb .in{padding:12px 14px}.sb h2{margin:0;font-size:34px;font-weight:700}.sb p{margin:0}
.sb .bg{position:absolute;right:10px;top:4px;font-size:64px;opacity:.2}
.sb a{display:block;background:#0000001a;color:#fffc;text-align:center;padding:3px;text-decoration:none;cursor:pointer}
.sb.b{background:var(--acc)}.sb.g{background:var(--ok)}.sb.y{background:var(--warn);color:#212529}.sb.r{background:var(--bad)}
.bar{height:10px;background:#e9ecef;border-radius:5px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
pre.log{margin:8px 0 0;max-height:240px;overflow:auto;font:12px ui-monospace,Consolas,monospace;white-space:pre-wrap;background:#f8f9fa;border:1px solid var(--line);border-radius:4px;padding:8px}
.alert{padding:10px 14px;border-radius:4px;margin:0 0 12px;border:1px solid}
.alert.ok{background:#d4edda;border-color:#c3e6cb;color:#155724}.alert.er{background:#f8d7da;border-color:#f5c6cb;color:#721c24}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;padding:40px 12px}
#modal .m{background:#fff;border-radius:4px;width:100%;max-width:640px;box-shadow:0 4px 20px #0005}
#modal .mh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center}
#modal .mh h3{margin:0;flex:1;font-weight:400;font-size:19px}
#modal .mb{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
#modal .mb label{display:block;font-weight:600;margin-bottom:3px}
#modal .mb .f1{grid-column:1/-1}
#pvbox{margin-top:8px;background:#000;border-radius:4px;min-height:60px;display:none;position:relative;text-align:center;color:#fff}
#pvbox img{width:100%;display:block;border-radius:4px}
#pvbox .pm{padding:22px 12px;color:#ffc107}
#modal .mb input,#modal .mb select,#modal .mb textarea{width:100%;padding:6px 9px;border:1px solid #ced4da;border-radius:4px}
#modal .mb small{color:var(--mut);display:block;margin-top:2px}
#modal .mf{padding:12px 16px;border-top:1px solid var(--line);text-align:right;display:flex;gap:8px;justify-content:flex-end}
.empty{text-align:center;color:var(--mut);padding:24px}
@media(max-width:800px){#side{position:fixed;inset:0 auto 0 0;z-index:10;margin-left:-250px}body.open #side{margin-left:0}#modal .mb{grid-template-columns:1fr}}

#modal .m.wide{max-width:1100px}
.ge{display:grid;grid-template-columns:200px minmax(320px,1fr) 260px;gap:14px;padding:16px}
.ge label{display:block;font-weight:600;margin-bottom:3px}
.ge input,.ge select{width:100%;padding:6px 9px;border:1px solid #ced4da;border-radius:4px}
.lays{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:340px;overflow:auto;margin-top:6px}
.lay{border:1px solid var(--line);border-radius:4px;background:#fff;padding:3px;cursor:pointer;text-align:center;font-size:11px;color:var(--mut)}
.lay.on{border-color:var(--acc);box-shadow:0 0 0 2px #007bff40;color:var(--fg)}
.lay .pv{display:grid;gap:1px;background:#8a95a8;aspect-ratio:16/10;margin-bottom:2px}.lay .pv i{background:#1e232e}
.gv{display:grid;gap:3px;background:#000;padding:3px;aspect-ratio:16/9;border-radius:4px;width:100%}
.ga{background:#1b202b;color:#9aa3b5;border:2px solid #000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px;padding:2px;overflow:hidden;cursor:pointer;position:relative;min-width:0}
.ga b{font-size:20px;color:#6b7690;font-weight:700}
.ga.has{background:#233048;color:#e8ecf4}.ga.has b{font-size:13px;color:#fff}
.ga.sel{border-color:#d4af37}
.ga.over{background:#2b3b5c}
.ga .x{position:absolute;top:1px;right:3px;font-size:14px;cursor:pointer;color:#ff8a8a;display:none}.ga.has:hover .x{display:block}
.ctree{border:1px solid var(--line);border-radius:4px;max-height:420px;overflow:auto;margin-top:6px;background:#fff}
.ctree .nh{background:#f1f3f5;padding:5px 8px;font-weight:600;position:sticky;top:0;cursor:pointer}
.ctree .ci{padding:4px 10px;cursor:grab;border-top:1px solid #f1f3f5;display:flex;gap:6px;align-items:center}
.ctree .ci:hover{background:#e8f1ff}.ctree .ci.used{color:#9aa0a6}
.ctree .ci em{margin-left:auto;font-style:normal;font-size:11px}
.ghint{color:var(--mut);font-size:12px;margin-top:6px}
@media(max-width:900px){.ge{grid-template-columns:1fr}}
</style></head><body>
<div id="app"></div>
<div id="modal"></div>
<script>
var tok=sessionStorage.getItem('tok'),me=null,schema=[],data={},ver=0,page='home',job=null,poll=null,msg=null,flt={nvr:'',q:''};
var META={
 nvrs:{t:'NVR',ic:'▣',lbl:{name:'Nama',host:'Host / IP',port:'Port',use_https:'HTTPS',username:'User NVR',password:'Password NVR',max_channels:'Jumlah kanal',model:'Model',location:'Lokasi',notes:'Catatan',cam_user:'User kamera (RTSP)',cam_pass:'Password kamera (RTSP)',rtsp_template:'Template RTSP substream',substream_param:'Parameter substream NVR'},
  full:['rtsp_template','substream_param','notes'],hint:{rtsp_template:'Contoh: rtsp://{user}:{pass}@{ip}:554/cam/realmonitor?channel=1&subtype=1'}},
 cameras:{t:'Kamera',ic:'◉',lbl:{nvr_id:'NVR',channel:'Kanal',name:'Nama',ip_address:'IP kamera',location:'Lokasi',note:'Catatan',cam_user:'User kamera (khusus)',cam_pass:'Password kamera (khusus)',rtsp_url:'URL RTSP substream',codec:'Codec',width:'Lebar',height:'Tinggi',scan_detail:'Hasil deteksi',reg_status:'Status di NVR (0 tidak terdaftar, 1 normal, 2 error koneksi)'},full:['rtsp_url','scan_detail','note'],hint:{cam_user:'Kosongkan bila sama dengan login kamera di data NVR.',rtsp_url:'Kosong = pakai template NVR + IP kamera. Dapat diisi otomatis lewat tombol Deteksi.'}},
 groups:{t:'Group',ic:'▦',lbl:{name:'Nama',layout:'Layout',slots:'Kamera per area',owner:'Pemilik',sort:'Urutan'},full:['slots'],hint:{slots:'Format: idNVR:kanal dipisah koma, area kosong dikosongkan. Contoh: 1:1,1:2,,1:5'}},
 sequences:{t:'Sequence',ic:'↻',lbl:{name:'Nama',steps:'Langkah',sort:'Urutan'},full:['steps'],hint:{steps:'Format: idGroup:detik dipisah koma. Contoh: 1:10,2:10,3:15'}},
 users:{t:'User',ic:'☺',lbl:{name:'Nama',level:'Level (0 = admin penuh, 1-5)',is_admin:'Admin',use_group:'Pakai group sendiri',password:'Password'},full:[]}
};
var BOOL={use_https:1,is_admin:1,use_group:1};
function $(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function api(m,u,b){return fetch(u,{method:m,headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().then(function(j){if(r.status==401){logout();throw new Error(j.error)}if(!r.ok)throw new Error(j.error||r.status);return j})})}
function logout(){tok=null;me=null;sessionStorage.removeItem('tok');render()}
function say(t,bad){msg={t:t,bad:bad};render()}
function nvrName(id){var n=(data.nvrs||[]).filter(function(x){return x.id==id})[0];return n?n.name:'#'+id}
function sch(r){return schema.filter(function(x){return x.route==r})[0]}

/* ---------- login ---------- */
function loginView(){
  var a=document.getElementById('app');
  a.innerHTML='<div id="login"><div class="lbox"><h1><b>PIR</b> VMS Server</h1><p>Masuk untuk mengelola konfigurasi</p><input id="u" placeholder="Nama user" autofocus><input id="p" type="password" placeholder="Password"><button class="btn p" id="go" style="width:100%;justify-content:center">Masuk</button><p id="e" style="color:var(--bad);margin:10px 0 0"></p></div></div>';
  var u=a.querySelector('#u'),p=a.querySelector('#p'),e=a.querySelector('#e');
  function go(){fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:u.value,pass:p.value})}).then(function(r){return r.json().then(function(j){if(!r.ok){e.textContent=j.error;return}tok=j.token;me=j.user;sessionStorage.setItem('tok',tok);boot()})})}
  a.querySelector('#go').onclick=go;p.onkeydown=function(ev){if(ev.key=='Enter')go()}
}
function boot(){Promise.all([api('GET','/api/me'),api('GET','/api/schema'),api('GET','/api/config'),api('GET','/api/jobs')]).then(function(r){me=r[0];schema=r[1];data=r[2];ver=data.version;var j=r[3];if(j&&j.state=='running'){job=j;pollJob()}render()}).catch(function(){})}
function reload(){return api('GET','/api/config').then(function(c){data=c;ver=c.version;render()})}

/* ---------- kerangka ---------- */
function render(){
  var a=document.getElementById('app');
  if(!tok){loginView();return}
  if(!me){a.innerHTML='';return}
  var admin=me.is_admin==1,cnt=function(r){return (data[r]||[]).length};
  var menu='<a data-p="home" class="'+(page=='home'?'on':'')+'"><span class="ic">⌂</span>Dashboard</a><div class="hd">Konfigurasi</div>';
  ['nvrs','cameras','groups','users'].forEach(function(r){if(!data[r])return;menu+='<a data-p="'+r+'" class="'+(page==r?'on':'')+'"><span class="ic">'+META[r].ic+'</span>'+META[r].t+'<em>'+cnt(r)+'</em></a>'});
  a.innerHTML='<div id="wrap"><aside id="side"><div class="brand"><div class="logo">IP</div><span><b>IPRO</b> NVR</span></div><div class="user"><i>'+esc(me.name.charAt(0).toUpperCase())+'</i><div>'+esc(me.name)+'<small>'+(admin?'Administrator':'Operator (hanya baca)')+'</small></div></div><nav>'+menu+'</nav><div class="ft">Versi konfigurasi: '+ver+'</div></aside><div id="main"><div id="top"><button class="burger">☰</button><span class="sp"></span><span class="v">'+esc(me.name)+'</span><button class="btn sm" id="lo">Keluar</button></div><div id="content"></div></div></div>';
  [].forEach.call(a.querySelectorAll('#side a'),function(x){x.onclick=function(){page=x.dataset.p;msg=null;document.body.classList.remove('open');render()}});
  a.querySelector('.burger').onclick=function(){document.body.classList.toggle('open')};
  a.querySelector('#lo').onclick=function(){api('POST','/api/logout').then(logout,logout)};
  var c=a.querySelector('#content');
  var body=page=='home'?home():listPage(page);
  c.appendChild(body);
  body.insertBefore($('<div id="job" class="card" style="display:none"></div>'),body.children[1]);   // di bawah judul halaman
  if(msg){c.insertBefore($('<div class="alert '+(msg.bad?'er':'ok')+'">'+esc(msg.t)+'</div>'),c.firstChild);msg=null}
  drawJob();
}
function head(title,sub){return $('<div class="ch"><h1>'+esc(title)+'</h1><div class="bc">Beranda / <b>'+esc(sub||title)+'</b></div></div>')}

/* ---------- dashboard ---------- */
function home(){
  var w=document.createElement('div');w.appendChild(head('Dashboard'));
  var cams=data.cameras||[],withUrl=cams.filter(function(c){return c.rtsp_url}).length;
  var bx=document.createElement('div');bx.className='boxes';
  function box(cls,n,t,ic,go){var b=$('<div class="sb '+cls+'"><div class="in"><h2>'+n+'</h2><p>'+t+'</p></div><div class="bg">'+ic+'</div><a>Lihat detail →</a></div>');b.querySelector('a').onclick=function(){page=go;render()};bx.appendChild(b)}
  box('b',(data.nvrs||[]).length,'NVR terdaftar','▣','nvrs');
  box('g',cams.length,'Kamera terdaftar','◉','cameras');
  box('y',withUrl+' / '+cams.length,'Kamera dengan URL RTSP','▶','cameras');
  box('r',(data.groups||[]).length,'Group tampilan','▦','groups');
  w.appendChild(bx);
  var c=$('<div class="card nt"><div class="ct"><h3>Ringkasan per NVR</h3></div><div class="cb"></div></div>');
  var t='<table><thead><tr><th>NVR</th><th>Alamat</th><th>Kamera</th><th>Dengan RTSP</th></tr></thead><tbody>';
  (data.nvrs||[]).forEach(function(n){var k=cams.filter(function(x){return x.nvr_id==n.id});var r=k.filter(function(x){return x.rtsp_url}).length;t+='<tr><td>'+esc(n.name)+'</td><td>'+esc(n.host)+':'+n.port+'</td><td>'+k.length+' / '+n.max_channels+'</td><td><span class="badge '+(k.length&&r==k.length?'ok':'warn')+'">'+r+' / '+k.length+'</span></td></tr>'});
  if(!(data.nvrs||[]).length)t+='<tr><td colspan="4" class="empty">Belum ada NVR. Buka menu NVR untuk mendaftarkan.</td></tr>';
  c.querySelector('.cb').innerHTML=t+'</tbody></table>';w.appendChild(c);return w}

/* ---------- daftar ---------- */
function cellFor(r,row){
  switch(r){
   case'nvrs':return[esc(row.name),esc(row.host)+':'+row.port+(row.use_https?' <span class="badge info">https</span>':''),esc(row.model),esc(row.location),(data.cameras||[]).filter(function(c){return c.nvr_id==row.id}).length+' / '+row.max_channels];
   case'cameras':return[row.channel+(row.reg_status==1?' <span class="badge ok" title="Terdaftar di NVR, koneksi normal">NVR</span>':row.reg_status==2?' <span class="badge warn" title="Terdaftar di NVR tetapi koneksi kamera error">error</span>':' <span class="badge" title="Tidak terdaftar di NVR (belum dideteksi atau sudah dihapus dari NVR)">-</span>'),esc(row.name),esc(row.ip_address)+(row.cam_user?' <span class="badge info" title="Login khusus kamera">login khusus</span>':''),esc(nvrName(row.nvr_id)),esc(row.location),row.rtsp_url?'<span class="mono" title="'+esc(row.rtsp_url)+'">'+esc(row.rtsp_url)+'</span>':'<span class="badge">belum</span>',row.width?'<span class="badge ok">'+esc(row.codec)+' '+row.width+'×'+row.height+'</span>':'-'];
   case'groups':return[esc(row.name),esc(row.layout),(row.slots||'').split(',').filter(function(x){return x}).length,esc(row.owner)];
   case'sequences':return[esc(row.name),(row.steps||'').split(',').filter(function(x){return x}).length+' langkah',esc(row.steps)];
   case'users':return[esc(row.name),row.level,row.is_admin?'<span class="badge ok">Admin</span>':'<span class="badge">Operator</span>',row.use_group?'Ya':'Tidak'];
  }}
var HEADS={nvrs:['Nama','Alamat','Model','Lokasi','Kamera'],cameras:['Ch','Nama','IP','NVR','Lokasi','URL RTSP','Stream'],groups:['Nama','Layout','Area terisi','Pemilik'],sequences:['Nama','Langkah','Detail'],users:['Nama','Level','Peran','Group sendiri']};
function listPage(r){
  var admin=me.is_admin==1,w=document.createElement('div'),m=META[r];
  w.appendChild(head('Daftar '+m.t,m.t));
  var card=$('<div class="card"><div class="ct"><h3>'+m.t+'</h3><div class="tools"></div></div><div class="cb" style="padding:0"></div></div>');
  var tools=card.querySelector('.tools'),rows=(data[r]||[]).slice();
  if(r=='cameras'){
    var sel=$('<select><option value="">Semua NVR</option></select>');(data.nvrs||[]).forEach(function(n){var o=document.createElement('option');o.value=n.id;o.textContent=n.name;if(flt.nvr==n.id)o.selected=true;sel.appendChild(o)});
    sel.onchange=function(){flt.nvr=sel.value;render()};tools.appendChild(sel);
    var q=$('<input placeholder="Cari nama / IP" value="'+esc(flt.q)+'">');q.onchange=function(){flt.q=q.value;render()};tools.appendChild(q);
    rows=rows.filter(function(c){return (!flt.nvr||c.nvr_id==flt.nvr)&&(!flt.q||(c.name+' '+c.ip_address+' '+c.location).toLowerCase().indexOf(flt.q.toLowerCase())>=0)});
    if(admin){var dn=$('<button class="btn i">Deteksi RTSP (NVR terpilih)</button>');dn.onclick=function(){if(!flt.nvr){alert('Pilih NVR dulu pada filter.');return}askDisc(+flt.nvr,[])};tools.appendChild(dn);
      var fn=$('<button class="btn p">Deteksi kamera dari NVR</button>');fn.onclick=function(){if(!flt.nvr){alert('Pilih NVR dulu pada filter.');return}fetchCams(+flt.nvr)};tools.appendChild(fn);
      var tp=$('<button class="btn">⇩ Template Excel</button>');tp.onclick=dlTemplate;tools.appendChild(tp);
      var up=$('<button class="btn s">⇧ Upload Excel (kamera)</button>');up.onclick=upIp;tools.appendChild(up);
      var gen=$('<button class="btn w">Buat kanal</button>');gen.onclick=genChannels;tools.appendChild(gen)}

  var st={running:['Berjalan','info'],done:['Selesai','ok'],cancelled:['Dibatalkan','warn'],error:['Error','bad']}[job.state]||[job.state,''];
  el.innerHTML='<div class="ct"><h3>Deteksi RTSP otomatis'+(job.nvr?' - '+esc(job.nvr):'')+'</h3><span class="badge '+st[1]+'">'+st[0]+'</span>'+(job.state=='running'?'<button class="btn sm d" id="jc">Batal</button>':'<button class="btn sm" id="jx">Tutup</button>')+'</div><div class="cb"><div>'+job.done+' / '+job.total+' kamera diproses · <b>'+job.found+'</b> URL ditemukan</div><div class="bar"><i style="width:'+pct+'%"></i></div><pre class="log">'+esc((job.lines||[]).join('\n'))+'</pre></div>';
  var c=document.getElementById('jc');if(c)c.onclick=function(){api('DELETE','/api/jobs/'+job.id)};
  var x=document.getElementById('jx');if(x)x.onclick=function(){job=null;el.style.display='none'};
  var pre=el.querySelector('pre');if(pre)pre.scrollTop=pre.scrollHeight}
if(tok)boot();else render();
</script></body></html>
